services:
  db:
    image: postgres:16-alpine
    container_name: ajv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ajv_college
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ajv_college"]
      interval: 5s
      timeout: 5s
      retries: 5

  ajv-collegeconnect:
    build: .
    container_name: ajv-collegeconnect
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: ajv-collegeconnect-production-secret
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ajv_college
      ADMIN_IP: 10.43.120.56
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    volumes:
      - ajv_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ajv_data:
