services:
  - type: web
    name: ajv-collegeconnect
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajv-collegeconnect-db
          property: connectionString

databases:
  - name: ajv-collegeconnect-db
    plan: free
    databaseName: ajv_collegeconnect
    user: ajv_admin
